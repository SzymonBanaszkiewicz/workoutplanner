services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: nbddb
      POSTGRES_USER: nbd
      POSTGRES_PASSWORD: nbdpassword
    ports:
      - "5432:5432"
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nbd -d nbddb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg: